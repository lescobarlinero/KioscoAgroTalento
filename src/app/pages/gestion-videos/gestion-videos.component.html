
<section class="text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto">
    <div class="flex flex-wrap mb-20">
      <div class="mr-6 mb-6 lg:mb-0">
        <h1 class="sm:text-3xl text-2xl font-medium title-font mb-2 text-gray-900">Todos los videos</h1>
        <div class="h-1 w-20 bg-secondary rounded"></div>
      </div>
      <button (click)="goToAddVideo()" class="bg-secondary hover:bg-secondary/90 transition-colors duration-100 ease-in-out px-4 py-2 rounded-md text-white">
        <i class="fa-solid fa-plus mr-2"></i> Agregar Video
      </button>
      <button (click)="goToSortVideos()" class="ml-2 bg-primary hover:bg-primary/90 transition-colors duration-100 ease-in-out px-4 py-2 rounded-md text-white">
        <i class="fa-solid fa-sort"></i> Ordenar Videos
      </button>
    </div>
    <div class="flex flex-wrap -m-4">
        <div *ngFor="let video of videos | async; let i = index" class="xl:w-1/4 md:w-1/2 p-4 flex">
          <div class="bg-gray-100 p-6 rounded-lg flex flex-col min-h-full min-w-full">
            <img class="h-40 rounded w-full object-cover object-center mb-6" [src]="getVideoThumbnail(video.url)" alt="content">
            <h3 class="tracking-widest text-secondary text-xs font-medium title-font">VIDEO</h3>
            <h2 class="text-lg text-gray-900 font-medium title-font mb-4 line-clamp-3">{{video.title}}</h2>
            <div class="mt-auto">
              <button (click)="deleteVideo(i)" class="bg-red-400 hover:bg-red-400/90 transition-colors duration-100 ease-in-out px-4 py-2 rounded-md text-white" >
                <i class="fa-solid fa-trash mr-2"></i> Eliminar Video
              </button>
            </div>
          </div>
        </div>
    </div>    
  </div>
</section>
