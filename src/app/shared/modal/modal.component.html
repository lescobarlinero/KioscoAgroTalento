<!-- Main modal -->
<div *ngIf="isVisible" id="default-modal" tabindex="-1" aria-hidden="true" class="flex bg-black/65 overflow-y-auto overflow-x-hidden fixed inset-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full">
    <div class="relative p-4 w-full max-w-5xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t+">
                <h3 class="text-xl font-semibold text-gray-900">
                    {{content.name}}
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center" (click)="hideModal()">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5 space-y-4" [ngSwitch]="content.multimediaType.id">
                <div *ngSwitchCase="1">
                    <!-- <iframe class="w-full h-auto aspect-video rounded-lg" [src]="sanitizedUrl" frameborder="0"></iframe> -->
                    <app-video-player [multimedia]="content" (mediaEnded)="hideModal()" [showTitle]="false" progressBarId="progress-bar-fg-modal" class="flex justify-center items-center flex-col mx-8"></app-video-player>
                </div>
                <div *ngSwitchCase="2"></div>
                    <img class="max-w-full w-full aspect-auto h-auto rounded-lg" [src]="getMediaUrl()" alt="">
                <div *ngSwitchCase="3">
                    <pdf-viewer [src]="content.url"></pdf-viewer>
                </div>

            </div>
            <!-- Modal footer -->
            <div class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b">
                <button (click)="hideModal()"
                type="button" class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100">Cerrar</button>
            </div>
        </div>
    </div>
</div>
